<div class="login-container">
  <div class="login-box">
    <h2>Welcome Back!</h2>
    <p class="subtitle">Sign in to continue to your account.</p>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label for="email">Email Address</label>
        <input 
          id="email" 
          type="email" 
          formControlName="email" 
          placeholder="Enter your email" 
        />
        <div *ngIf="f['email'].invalid && (f['email'].dirty || f['email'].touched)" class="error-message">
          <span *ngIf="f['email'].errors?.['required']">Email is required.</span>
          <span *ngIf="f['email'].errors?.['email']">Must be a valid email format.</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          id="password" 
          type="password" 
          formControlName="password" 
          placeholder="Enter your password" 
        />
        <div *ngIf="f['password'].invalid && (f['password'].dirty || f['password'].touched)" class="error-message">
          <span *ngIf="f['password'].errors?.['required']">Password is required.</span>
        </div>
        <a href="/forgot-password" class="forgot-password-link">Forgot Password?</a>
      </div>

      <div *ngIf="loginError" class="server-error">{{ loginError }}</div>

      <button 
        type="submit" 
        [disabled]="loginForm.invalid || isSubmitting" 
        class="submit-button"
      >
        {{ isSubmitting ? 'Signing In...' : 'Login' }}
      </button>

    </form>
    
    <div class="footer-text">
        Don't have an account? <a href="/register">Sign Up</a>
    </div>
  </div>
</div>
